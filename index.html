<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KibooM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=31">
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo"><button class="logo-btn kiboom" id="logo-btn" type="button" aria-label="KibooM"><span class="kb kb-k">K</span><span class="kb kb-i">I</span><span class="kb kb-b">B</span><span class="kb-o"><i></i></span><span class="kb-o"><i></i></span><span class="kb kb-m">M</span></button></h1>
    <div class="head-right">
    <div class="head-btns" id="game-btns" hidden>
      <button class="act ghost" id="btn-menu" type="button">☰ <span id="lbl-menu">Menu</span></button>
      <label class="level-wrap"><span id="lbl-level">Niveau</span>
        <select id="level"></select>
      </label>
      <button class="act" id="btn-new" type="button">Nouvelle partie</button>
      <button class="act ghost" id="btn-rules" type="button" aria-haspopup="dialog">📖 <span id="lbl-rules">Règles du jeu</span></button>
    </div>
    <button class="act" id="btn-home" type="button"></button>
    <button class="act ghost" id="btn-sfx" type="button"></button>
    <button class="act ghost" id="btn-voice" type="button"></button>
    <button class="act ghost" id="player-btn" type="button"></button>
    <label class="lang-wrap"><span aria-hidden="true">🌐</span><select id="lang"></select></label>
    </div>
  </header>

  <div class="mood-bar" id="mood-bar" hidden></div>

  <section id="menu-screen">
    <h2 class="menu-title" id="kimind-title"></h2>
    <div class="versions" id="versions"></div>
    <h2 class="menu-title" id="games-title"></h2>
    <div class="versions" id="games"></div>
    <h2 class="menu-title" id="fun-title"></h2>
    <div class="versions" id="fun"></div>
    <h2 class="menu-title" id="perso-title"></h2>
    <div class="versions" id="perso"></div>
  </section>

  <section id="stats-screen" class="game-other" hidden>
    <div class="other-head">
      <h2 class="other-title" id="stats-title"></h2>
      <div class="other-ctrl">
        <button class="act ghost" id="stats-menu" type="button"></button>
        <label class="level-wrap"><span id="lbl-stats-player"></span><select id="stats-player"></select></label>
      </div>
    </div>
    <div class="panel" id="stats-body"></div>
    <p class="pick-row">
      <button class="act" id="stats-export-pl" type="button"></button>
      <button class="act ghost" id="stats-export-json" type="button"></button>
      <button class="act ghost" id="stats-clear" type="button"></button>
    </p>
  </section>

  <section id="kimba-screen" class="game-other" hidden></section>
  <section id="kiplus-screen" class="game-other" hidden></section>
  <section id="kijun-screen" class="game-other" hidden></section>
  <section id="kipharaon-screen" class="game-other" hidden></section>
  <section id="kidory-screen" class="game-other" hidden></section>
  <section id="kibal-screen" class="game-other" hidden></section>
  <section id="kipotter-screen" class="game-other" hidden></section>
  <section id="kicompuzzle-screen" class="game-other" hidden></section>
  <section id="kipuzzle-screen" class="game-other" hidden></section>
  <section id="kiduel-screen" class="game-other" hidden></section>

  <div id="game-screen" hidden>
  <p class="tagline" id="tagline"></p>

  <div class="layout">
    <div class="play-col">
      <section class="statement" aria-live="polite">
        <div class="stat"><span class="stat-lbl" id="lbl-sum"></span><span class="sum" id="sum"></span></div>
        <div class="stat"><span class="stat-lbl" id="lbl-order"></span><span class="order" id="order"></span></div>
        <div class="stat" id="double-stat" hidden><span class="stat-lbl" id="lbl-double"></span><span id="double"></span></div>
      </section>

      <section class="table">
        <h2 class="zone-title" id="lbl-hidden"></h2>
        <div class="slots" id="hidden-cards"></div>
      </section>

      <section class="table offer" id="offer-zone">
        <h2 class="zone-title" id="lbl-offer"></h2>
        <div class="slots" id="offer"></div>
      </section>

      <section class="panel" id="panel">
        <p class="hint" id="hint"></p>
        <div class="picker">
          <div class="pick-row"><span class="pick-lbl" id="lbl-colour"></span><div class="choices" id="colours"></div></div>
          <div class="pick-row"><span class="pick-lbl" id="lbl-value"></span><div class="choices" id="values"></div></div>
          <div class="pick-row">
            <button class="act big" id="btn-propose" type="button" disabled></button>
            <span class="warn" id="warn"></span>
          </div>
        </div>
      </section>

      <p class="won" id="won" hidden></p>

      <section class="status">
        <span id="rounds"></span>
        <label class="toggle"><input type="checkbox" id="show-possible"> <span id="lbl-possible"></span></label>
        <span id="possible" hidden></span>
      </section>
    </div>

    <aside class="history-col">
      <h2 class="zone-title" id="lbl-history"></h2>
      <p class="history-empty" id="history-empty"></p>
      <ol class="rounds" id="history" reversed aria-live="polite"></ol>
    </aside>
  </div>
  </div>
</div>

<div class="home" id="home" hidden></div>

<div class="parade" id="parade" hidden>
  <h2 class="parade-title" id="parade-title"></h2>
  <div class="parade-modes" id="parade-modes" role="group"></div>
  <div class="parade-floor" id="parade-floor" aria-live="polite"></div>
  <div class="parade-nav">
    <button class="act ghost" type="button" id="parade-pause"></button>
    <button class="act ghost" type="button" id="parade-sound"></button>
    <button class="act ghost" type="button" id="parade-back"></button>
    <button class="act" type="button" id="parade-next"></button>
  </div>
</div>

<dialog id="dlg-player">
  <h2 id="player-title"></h2>
  <p id="player-hint"></p>
  <div class="pick-row" id="player-list"></div>
  <form class="pick-row" id="player-form">
    <input id="player-name" type="text" maxlength="30" autocomplete="off">
    <button class="act" id="player-ok" type="submit"></button>
  </form>
</dialog>

<dialog id="dlg-intro" class="intro">
  <h2 id="intro-title"></h2>
  <dl id="intro"></dl>
  <form method="dialog"><button class="act" id="btn-intro-close"></button></form>
</dialog>

<dialog id="dlg-rules">
  <h2 id="rules-title"></h2>
  <ul id="rules-body"></ul>
  <form method="dialog"><button class="act" id="btn-close"></button></form>
</dialog>

<script src="lang/fr.js?v=31"></script>
<script src="lang/en.js?v=31"></script>
<script src="js/versions.js?v=31"></script>
<script src="js/store.js?v=31"></script>
<script src="lang/personnages.js?v=31"></script>
<script src="lang/parade-modes.js?v=31"></script>
<script src="js/kimind.js?v=31"></script>
<script src="js/sound.js?v=31"></script>
<script src="js/voice.js?v=31"></script>
<script src="js/audio.js?v=31"></script>
<script src="js/parade.js?v=31"></script>
<script src="js/home.js?v=31"></script>
<script src="js/colourgame.js?v=31"></script>
<script src="js/kijun.js?v=31"></script>
<script src="js/kipharaon.js?v=31"></script>
<script src="js/kidory.js?v=31"></script>
<script src="js/kibal.js?v=31"></script>
<script src="js/kipotter.js?v=31"></script>
<script src="js/kicompuzzle.js?v=31"></script>
<script src="js/kipuzzle.js?v=31"></script>
<script src="js/kiduel.js?v=31"></script>
<script src="js/stats.js?v=31"></script>
<script src="js/game.js?v=31"></script>
</body>
</html>
